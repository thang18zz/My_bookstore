server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/bookstore;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB

app:
  jwt:
    secret: "BOOKSTORE_SUPER_SECRET_KEY_FOR_JWT_TOKEN_GENERATION_2026_AT_LEAST_256_BITS"
    expiration-ms: 86400000 # 24h

groq:
  api-key: ${GROQ_API_KEY:your_groq_api_key_here}
  base-url: https://api.groq.com/openai/v1/chat/completions
  model: qwen/qwen3.8-27b
  max-tokens: 512
  temperature: 0.4
