server:
  port: 8080

spring:
  config:
    import: "optional:classpath:application-local.yml"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bookstore?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 5MB
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

monapay:
  base-url: ${MONAPAY_BASE_URL:https://api.monapay.vn}
  client-id: ${MONAPAY_CLIENT_ID:}
  client-secret: ${MONAPAY_CLIENT_SECRET:}
  webhook-secret: ${MONAPAY_WEBHOOK_SECRET:}
  sandbox: true
  expires-in: 900
  return-url: ${MONA_RETURN_URL:https://deafeningly-conjugated-marisha.ngrok-free.dev/orders}
  cancel-url: ${MONA_CANCEL_URL:https://deafeningly-conjugated-marisha.ngrok-free.dev/cart}

app:
  jwt:
    secret: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_256_BITS"
    expiration-ms: 86400000 # 24h

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: https://api.groq.com/openai/v1/chat/completions
  model: qwen/qwen3.8-27b
  max-tokens: 300
  temperature: 0.4

