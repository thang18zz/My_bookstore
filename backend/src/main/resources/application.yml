server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/bookstore?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 5MB

app:
  jwt:
    secret: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_256_BITS"
    expiration-ms: 86400000 # 24h

groq:
  api-key: ${GROQ_API_KEY:your_groq_api_key_here}
  base-url: https://api.groq.com/openai/v1/chat/completions
  model: qwen/qwen3.8-27b
  max-tokens: 400
  temperature: 0.4
